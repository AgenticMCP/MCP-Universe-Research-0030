name: Issue Label Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Post label-based reply
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            let body;
            if (labels.includes('bug')) {
              body = 'Thank you. We will fix it.';
            } else if (labels.includes('feature')) {
              body = 'Thank you, we will consider to include this feature.';
            } else if (labels.includes('discussion')) {
              body = 'Thanks for starting this discussion! We welcome community input.';
            } else {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
